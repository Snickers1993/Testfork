name: Moonveil source audit

on:
  workflow_dispatch:
  push:
    branches: [Module-1]
    paths: [.github/workflows/moonveil-reference-snapshot.yml]

permissions:
  contents: read

jobs:
  references:
    if: github.repository == 'Snickers1993/Testfork' && github.ref == 'refs/heads/Module-1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Snapshot public references without executing donor code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moonveil-references
          cd /tmp/moonveil-references
          for repo in tamas-hub/tamagrid rita152/Echora berylorg/beryl; do
            name="${repo##*/}"
            git clone --depth 1 "https://github.com/${repo}.git" "$name"
            git -C "$name" rev-parse HEAD > "${name}.commit"
            printf '%s\n' "$repo" > "${name}.repository"
            rm -rf "$name/.git"
          done
          git clone --depth 1 --branch rust-v0.154.0 https://github.com/openai/codex.git codex
          git -C codex rev-parse HEAD > codex.commit
          printf '%s\n' openai/codex > codex.repository
          rm -rf codex/.git
          tar -czf /tmp/moonveil-references.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: moonveil-public-source-audit-${{ github.sha }}
          path: /tmp/moonveil-references.tar.gz
          retention-days: 3
