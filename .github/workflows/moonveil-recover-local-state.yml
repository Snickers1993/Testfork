name: Moonveil local state recovery

on:
  push:
    branches: [Module-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.repository == 'Snickers1993/Testfork'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover implementation transfer archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir recovery
          i=0
          for sha in \
            9cbfcfb6bc407dfb21079b74dcc0d265bd98263c \
            3896d0951151dd9e02ab8fa249c34077d443402b \
            993189a0c17dd2baf8d6e26122171c3ed513d606
          do
            i=$((i+1))
            gh api "repos/${REPO}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 --decode > "recovery/chunk${i}.bin"
          done
          cat recovery/chunk1.bin recovery/chunk2.bin recovery/chunk3.bin > recovery/moonveil-local-state.gz
          gzip -t recovery/moonveil-local-state.gz
          gzip -dc recovery/moonveil-local-state.gz > recovery/moonveil-local-state.raw
          file recovery/* > recovery/FILE_TYPES.txt
          sha256sum recovery/* > recovery/SHA256SUMS.txt
          ls -lh recovery > recovery/CONTENTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moonveil-local-state-recovery-${{ github.sha }}
          path: recovery
          retention-days: 1
