name: Moonveil local state recovery

on:
  push:
    branches: [Module-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.repository == 'Snickers1993/Testfork'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover implementation patch archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir recovery
          i=0
          for sha in \
            9cbfcfb6bc407dfb21079b74dcc0d265bd98263c \
            a8a2a5959e70e5bbeaad420a4a6dc5e0750f5211 \
            6ba782c1d64f504532b49c211e975afb8cc9aa19 \
            9ab9321c6fd8adcd32393fb6b4498791441a021f \
            9fa8b1ca85214c938350352a153448bda9b49de0 \
            d14878e7af044390cb2d3e7a595cb65151ad9297 \
            fafc9d772cf329b28afbcd3b8ff85faa37a11d8c
          do
            i=$((i+1))
            gh api "repos/${REPO}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 --decode > "recovery/chunk${i}.bin"
          done
          cat recovery/chunk{1..7}.bin > recovery/module1.patch.gz
          gzip -t recovery/module1.patch.gz
          gzip -dc recovery/module1.patch.gz > recovery/module1.patch
          test "$(wc -c < recovery/module1.patch)" -ge 200000
          grep -q '^diff --git a/src/features/moonveil/GuildHall.tsx' recovery/module1.patch
          grep -q '^diff --git a/src-tauri/src/shared/moonveil_core.rs' recovery/module1.patch
          file recovery/* > recovery/FILE_TYPES.txt
          sha256sum recovery/* > recovery/SHA256SUMS.txt
          ls -lh recovery > recovery/CONTENTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moonveil-module1-implementation-patch-${{ github.sha }}
          path: recovery
          retention-days: 1
